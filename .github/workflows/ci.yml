name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run Ruff Linting
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

  css:
    name: Tailwind CSS Bundle Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies & build CSS
        run: npm ci && npm run build:css

      - name: Verify compiled CSS is committed
        run: git diff --exit-code static/css/app.css

  test:
    name: Test Suite & Deployment Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      SECRET_KEY: "ci-insecure-test-key-strictly-for-automated-github-actions-testing"
      DEBUG: "False"
      DB_ENGINE: "django.db.backends.sqlite3"
      DB_NAME: "ci_test_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Check for missing Django migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Django Deployment Security Check
        env:
          SECURE_SSL_REDIRECT: "True"
        run: uv run python manage.py check --deploy

      - name: Run Django Test Suite
        run: uv run python manage.py test --verbosity=2
